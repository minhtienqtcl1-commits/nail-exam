y sấp bàn tay hướng xuống đất)", "Cotton tipped wooden stick/ Que gỗ quấn bông"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Sodium hydroxide or potassium hydroxide at 2-5%"]}, {"id": "IMG_4297-21", "source_image": "IMG_4297.HEIC", "question": "Vật dụng nào sau đây là ví dụ về vật dụng dùng một lần?", "answer": "**Pumice stone/ Đá bọt**", "distractors": ["Lau chùi với alcohol", "Giữ máy chuyển động", "Effleurage / Vuốt"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Pumice stone/ Đá bọt"]}, {"id": "IMG_4297-22", "source_image": "IMG_4297.HEIC", "question": "Lớp nào sau đây của da liên tục bị bong tróc và được thay thế bởi các tế bào cấu tạo từ keratin?", "answer": "**Horny/ Lớp sừng**", "distractors": ["Cơ xòe bàn tay", "Xương trụ (Ulna)", "Fissure/ Vết nứt"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Horny/ Lớp sừng"]}, {"id": "IMG_4297-23", "source_image": "IMG_4297.HEIC", "question": "Tên gọi của một chất giúp đẩy nhanh phản ứng hóa học là gì?", "answer": "**Catalyst**", "distractors": ["Dũa form", "Activator", "Bôi dầu"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Catalyst"]}, {"id": "IMG_4297-24", "source_image": "IMG_4297.HEIC", "question": "Các vật dụng không thể khử trùng được gọi là?", "answer": "**Single-use**", "distractors": ["Onycholysis", "Disinfection", "1/2 inch"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Single-use"]}, {"id": "IMG_4297-25", "source_image": "IMG_4297.HEIC", "question": "Một đặc điểm của móng tự nhiên là?", "answer": "**They are appendages of the skin/ Chúng là các phần phụ của da**", "distractors": ["Photo inhibitor (đây là câu trả lời của một câu hỏi rất khó hiểu)", "không phải là thanh phần của đầu móng (có hình nữa mặt trăng)", "Nói với khách hàng về khả năng làm việc của đồng nghiệp"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["They are appendages of the skin/ Chúng là các phần phụ của da"]}, {"id": "IMG_4297-26", "source_image": "IMG_4297.HEIC", "question": "Vi khuẩn còn được gọi là?", "answer": "**Microbes/ germs/ Vi sinh vật/ mầm bệnh**", "distractors": ["Sau mỗi ngày hoặc khi bị phơi nhiễm", "Cất vào hộp có nắp đậy kín khi không (dùng)", "Khả năng có thể chống lại các bệnh tật"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Microbes/ germs/ Vi sinh vật/ mầm bệnh"]}, {"id": "IMG_4297-27", "source_image": "IMG_4297.HEIC", "question": "Khi tư vấn cho khách hàng bị xước măng rô, lời khuyên chăm sóc phù hợp nhất là?", "answer": "**Receive a hot oil manicure/ Thực hiện liệu trình dưỡng móng bằng dầu nóng**", "distractors": ["They are appendages of the skin/ Chúng là các phần phụ của da", "không phải là t r Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Vapors/ Hơi"]}, {"id": "IMG_4297-30", "source_image": "IMG_4297.HEIC", "question": "Các bản móng có độ cong tăng cường thường có những đường cong sâu hoặc sắc nét tại bờ tự do. Hình dạng này được xác định bởi?", "answer": "**The matrix/ Mầm móng**", "distractors": ["Bệnh cắn móng tay", "Móng bị chẻ và chóc", "Để làm callus gót chân"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["The matrix/ Mầm móng"]}, {"id": "IMG_4297-31", "source_image": "IMG_4297.HEIC", "question": "Căn bệnh có thể ảnh hưởng đến nền móng, khiến vùng này xuất hiện các đốm màu từ vàng nhạt đến đỏ dưới bản móng – được gọi là \"đốm cá hồi\" (salmon patches) – là?", "answer": "**Nail psoriasis/ Vảy nến móng**", "distractors": ["Móng quặp, móng mọc dâm khóe", "Medical history/ Tiền sử bệnh lý", "Chỉ làm thêm phần móng mới mọc ra."], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Nail psoriasis/ Vảy nến móng"]}, {"id": "IMG_4297-32", "source_image": "IMG_4297.HEIC", "question": "Phát biểu nào sau đây mô tả về bệnh viêm quanh móng?", "answer": "**It is a bacterial infection of tissues surrounding the nail/ Đó là một bệnh nhiễm khuẩn ở các mô bao quanh móng**", "distractors": ["Improper preparation: clean and dry/ Việc chuẩn bị không đúng cách (làm sạch và làm khô móng)", "Occupational safety and health administration/ Cục Quản lý An toàn và Sức khỏe Nghề nghiệp", "dùng dụng cụ không đúng cách khử trùng không đúng cách, sản phẩm không đúng"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["It is a bacterial infection of tissues surrounding the nail/ Đó là một bệnh nhiễm khuẩn ở các mô bao quanh móng"]}, {"id": "IMG_4298-33", "source_image": "IMG_4298.HEIC", "question": "Yếu tố nào sau đây là các đốm trắng trên móng?", "answer": "**Leukonychia**", "distractors": ["Thẳng ngang", "Hypertrophy", "Fabric/ Vải"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Leukonychia"]}, {"id": "IMG_4298-34", "source_image": "IMG_4298.HEIC", "question": "Sự phát triển của bản móng người khỏe mạnh chủ yếu được quyết định bởi chế độ ăn uống hợp lý, việc tập luyện thể dục và sức khỏe thể chất. Hình dáng, chiều rộng và độ dày của móng được quyết định bởi?", "answer": "**The matrix**", "distractors": ["cán cây cọ", "1/8 inch", "Gel builder."], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["The matrix"]}, {"id": "IMG_4298-35", "source_image": "IMG_4298.HEIC", "question": "Cơ quan nào sau đây là cơ quan lớn nhất trong cơ thể người?", "answer": "**Skin**", "distractors": ["Triceps", "Patella", "Bọc móng"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Skin"]}, {"id": "IMG_4298-36", "source_image": "IMG_4298.HEIC", "question": "Cơ nào sau đây giúp nâng bàn chân lên và duỗi các ngón chân?", "answer": "**Extensor digitorum/ Cơ duỗi ngón**", "distractors": ["Xương ngón tay (gồm 14 lóng tay)", "Radial nerve (dây thần kinh quay)", "Da biểu bì dầy dưới đầu móng"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Extensor digitorum/ Cơ duỗi ngón"]}, {"id": "IMG_4298-37", "source_image": "IMG_4298.HEIC", "question": "Tên của cơ giúp xoay lòng bàn tay lên trên là gì?", "answer": "**Supinator/ Cơ ngửa**", "distractors": ["Radius (xương quay)", "Phalanges. 14 xương.", "Fissure/ Vết nứt"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Supinator/ Cơ ngửa"]}, {"id": "IMG_4298-38", "source_image": "IMG_4298.HEIC", "question": "Phản ứng hóa học nào sau đây có thể sinh ra nhiệt?", "answer": "**Polymerization/ Phản ứng trùng hợp**", "distractors": ["vufg stress area (vùng stress area)", "Phản ứng hóa học (chemical reaction)", "Cho vào giấy thấm bỏ vào bọc rồi vứt"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Polymerization/ Phản ứng trùng hợp"]}, {"id": "IMG_4298-39", "source_image": "IMG_4298.HEIC", "question": "Một thuật ngữ kỹ thuật cho móng mọc ngược là?", "answer": "**Onychocryptosis**", "distractors": ["Nấm (ring worm)", "Dụng cụ mài mòn", "Móng bị đổi màu"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Onychocryptosis"]}, {"id": "IMG_4298-40", "source_image": "IMG_4298.HEIC", "question": "Người thực hiện đã vô tình làm đứt tay khách hàng bằng một dụng cụ kim loại. Dụng cụ này cần phải được?", "answer": "**Disinfected/ khử trùng**", "distractors": ["vệ sinh (sanitation)", "Găng tay và khẩu trang.", "Tháo gỡ và lau sạch"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Disinfected/ khử trùng"]}, {"id": "IMG_4298-41", "source_image": "IMG_4298.HEIC", "question": "Dụng cụ nào giúp tạo độ bóng và làm nhẵn các đường gợn sóng trên móng tự nhiên trong quá trình làm móng?", "answer": "**Buffer** (cục đánh bóng 3 mặt)", "distractors": ["Kích thích", "Thời trang", "3/32 inch"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "✅ Đã sửa theo nguồn: https://www.nailsmag.com/articles/time-to-shine (ảnh ghi: \"Nail brush\")", "keywords": ["Buffer"]}, {"id": "IMG_4298-42", "source_image": "IMG_4298.HEIC", "question": "Người hành nghề nên từ chối phục vụ khách hàng khi xuất hiện trường hợp nào sau đây?", "answer": "**Infection, inflammation, or swelling/ Nhiễm trùng, viêm hoặc sưng tấy**", "distractors": ["Thoa primer, dũa bột acrylic, pha thuốc tẩy uế (chọn 1 trong 3 đều đúng)", "dùng dụng cụ không đúng cách khử trùng không đúng cách, sản phẩm không đúng", "Rinse thoroughly with water and dry/ Rửa thật sạch bằng nước và lau khô"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Infection, inflammation, or swelling/ Nhiễm trùng, viêm hoặc sưng tấy"]}, {"id": "IMG_4298-43", "source_image": "IMG_4298.HEIC", "question": "Khi thực hiện quy trình làm móng cơ bản, cần đặc biệt lưu ý đến bước giũa móng tay. Móng tay thường mỏng manh và dễ gãy hơn, do đó nên được giũa theo cách?", "answer": "**Right to center, then left to center/ Từ phải vào giữa, sau đó từ trái vào giữa**", "distractors": ["bắp thịt kéo bàn tay thẳng lên, bẻ cổ tay và tạo các ngón tay về cánh tay trước", "Cơ bắp thịt xoay bàn tay vào trong. Lòng bàn tay hướng xuống đất", "cơ bắt nguồn từ phần trên của xương mác và uốn cong bàn chân xuống"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Right to center, then left to center/ Từ phải vào giữa, sau đó từ trái vào giữa"]}, {"id": "IMG_4298-44", "source_image": "IMG_4298.HEIC", "question": "Sau khi hoàn tất dịch vụ làm móng, các dụng cụ sử dụng một lần được đặt vào loại vật chứa nào sau đây?", "answer": "**Trash container/ Thùng rác**", "distractors": ["Khuyến nghị của nhà sản xuất", "từ vách này qua vách kia", "Từ gốc móng, tới thân móng"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Trash container/ Thùng rác"]}, {"id": "IMG_4298-45", "source_image": "IMG_4298.HEIC", "question": "Kỹ thuật viên làm móng đã sẵn sàng chuẩn bị cho khách hàng tiếp theo – người sẽ thực hiện dịch vụ nối dài móng bằng móng giả (nail tips). Loại keo dán được sử dụng để gắn móng giả lên móng thật của khách hàng được gọi là?", "answer": "**Adhesive bonding agent/ Chất kết dính**", "distractors": ["Người thợ nên dùng bên mịn của giũa giấy", "Chỉ làm thêm phần móng mới mọc ra.", "từ góc móng tới ….. (bản in bị bỏ trống)"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Adhesive bonding agent/ Chất kết dính"]}, {"id": "IMG_4299-46", "source_image": "IMG_4299.HEIC", "question": "Động tác xoa bóp thư giãn nào sau đây, được sử dụng trong quy trình làm móng tay và móng chân, có đặc điểm là chậm rãi, nhịp nhàng và vuốt nhẹ?", "answer": "**Effleurage / Vuốt**", "distractors": ["Chắc, dễ uốn cong", "Wart (mụn cóc)", "Dũa trên mặt móng"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Effleurage / Vuốt"]}, {"id": "IMG_4299-47", "source_image": "IMG_4299.HEIC", "question": "Sản phẩm nào sau đây được sử dụng ngay trước khi sơn móng màu?", "answer": "**Base coat**", "distractors": ["Thẩm thấu", "cán cây cọ", "Acrylic."], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Base coat"]}, {"id": "IMG_4299-48", "source_image": "IMG_4299.HEIC", "question": "Động tác xoa bóp cần được hoàn thiện và sử dụng một cách điêu luyện nhằm mục đích giúp khách hàng thư giãn trong quá trình làm móng chân được gọi là?", "answer": "**Effleurage / Vuốt**", "distractors": ["Dũa trên mặt móng", "Tốt và thích hợp", "có thể là không có"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Effleurage / Vuốt"]}, {"id": "IMG_4299-49", "source_image": "IMG_4299.HEIC", "question": "Dịch vụ nào sau đây được khuyên dùng cho da và móng khô?", "answer": "**Warm oil/lotion**", "distractors": ["Fissure/ Vết nứt", "Cơ xòe bàn tay", "Cơ giang (Abductor)"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Warm oil/lotion"]}, {"id": "IMG_4299-50", "source_image": "IMG_4299.HEIC", "question": "Yếu tố nào sau đây chứa thông tin cần thiết để thực hiện một dịch vụ làm móng thành công?", "answer": "**Client card/ Thẻ khách hàng**", "distractors": ["Trash container/ Thùng rác", "từ vách này qua vách kia", "Abrasive file/ Dũa mài"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Client card/ Thẻ khách hàng"]}, {"id": "IMG_4299-51", "source_image": "IMG_4299.HEIC", "question": "Chất nào sau đây là một trong những dung môi an toàn và phổ biến nhất được sử dụng tại các tiệm làm đẹp?", "answer": "**Acetone**", "distractors": ["Hoá chất", "Đeo kính", "Sự tẩy uế"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Acetone"]}, {"id": "IMG_4299-52", "source_image": "IMG_4299.HEIC", "question": "Kỹ thuật giũa móng tự nhiên nào sau đây có thể gây ra tình trạng móng mọc ngược?", "answer": "**Into the corners/ Giũa sâu vào các góc móng**", "distractors": ["1. Có màu trắng ở viền. 2. Màu hồng, trắng.", "Nail plate (Thân móng nằm trên giường móng)", "(dịch từ chữ free edge) đầu móng, viền móng"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Into the corners/ Giũa sâu vào các góc móng"]}, {"id": "IMG_4299-53", "source_image": "IMG_4299.HEIC", "question": "Đối với các chuyên gia cung cấp dịch vụ làm đẹp và tạo hình móng, việc đầu tư một máy dũa điện là một tài sản giá trị. Khi lựa chọn thiết bị này, bạn nên cân nhắc đến yếu tố mô-men xoắn của máy. Mô-men xoắn được xem là yếu tố quyết định đến?", "answer": "**Power/ Công suất máy**", "distractors": ["Biểu bì dưới đầu móng", "Nấm ở tay (o được làm)", "Sưng trong móng tay"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Power/ Công suất máy"]}, {"id": "IMG_4299-54", "source_image": "IMG_4299.HEIC", "question": "Trong quá trình tạo hình móng giả, yếu tố nào sau đây giúp đẩy nhanh quá trình hóa học?", "answer": "**Catalyst/ Chất xúc tác**", "distractors": ["Methyl methacry(late)", "scrubs (chất mài mòn)", "áp dụng (làm) ko đúng"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Catalyst/ Chất xúc tác"]}, {"id": "IMG_4299-55", "source_image": "IMG_4299.HEIC", "question": "Khi thực hiện dịch vụ chăm sóc móng chân, điều vô cùng quan trọng cần ghi nhớ là không được đẩy hoặc cắt phần biểu bì gốc móng (eponychium). Điều này đặc biệt quan trọng đối với những khách hàng mắc các bệnh lý như?", "answer": "**Diabetes/ Tiểu đường**", "distractors": ["Biểu bì dưới đầu móng", "Sưng trong móng tay", "Giũa không đúng cách"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Diabetes/ Tiểu đường"]}, {"id": "IMG_4299-56", "source_image": "IMG_4299.HEIC", "question": "Bộ phận nào của móng giả có điểm dừng định vị để căn chỉnh với móng thật?", "answer": "**Well/ Phần lõm**", "distractors": ["Nhựa dẻo và vải", "Nòng trong trục", "Thẳng ngang"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Well/ Phần lõm"]}, {"id": "IMG_4299-57", "source_image": "IMG_4299.HEIC", "question": "Các dụng cụ làm móng dùng một lần bị loại bỏ vì chúng?", "answer": "**Are unable to be disinfected and reused/ Không thể khử trùng và tái sử dụng**", "distractors": ["dùng dụng cụ không đúng cách khử trùng không đúng cách, sản phẩm không đúng", "Infection, inflammation, or swelling/ Nhiễm trùng, viêm hoặc sưng tấy", "Thoa primer, dũa bột acrylic, pha thuốc tẩy uế (chọn 1 trong 3 đều đúng)"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Are unable to be disinfected and reused/ Không thể khử trùng và tái sử dụng"]}, {"id": "IMG_4299-58", "source_image": "IMG_4299.HEIC", "question": "Việc sử dụng loại ánh sáng nào giúp làm khô móng gel?", "answer": "**Ultraviolet/ Đèn cực tím (UV)**", "distractors": ["Nhanh mịn (khéo léo, mềm mại)", "Trợ giúp sơn dính vào móng", "Không tự nhiên và không đồng đều"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Ultraviolet/ Đèn cực tím (UV)"]}, {"id": "IMG_4299-59", "source_image": "IMG_4299.HEIC", "question": "Trong quá trình đánh giá tình trạng khách hàng để thực hiện dịch vụ làm móng, vùng da quanh một móng tay bị đỏ và sưng tấy. Người thực hiện dịch vụ nên thực hiện hành động nào sau đây?", "answer": "**Tell the client about the disease and refer the client to a physician/ Thông báo cho khách hàng về tình trạng bệnh lý và giới thiệu khách hàng đến gặp bác sĩ**", "distractors": ["bắp thịt kéo bàn tay thẳng lên, bẻ cổ tay và tạo các ngón tay về cánh tay trước", "Right to center, then left to center/ Từ phải vào giữa, sau đó từ trái vào giữa", "cơ dính vào mặt sau phía dưới của gót chân và kéo bàn chân xuống"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Tell the client about the disease and refer the client to a physician/ Thông báo cho khách hàng về tình trạng bệnh lý và giới thiệu khách hàng đến gặp bác sĩ"]}, {"id": "IMG_4300-60", "source_image": "IMG_4300.HEIC", "question": "Các khuôn mẫu có thể tái sử dụng được làm bằng nhôm hoặc?", "answer": "**Plastic/ Nhựa**", "distractors": ["Thuỷ tinh sợi", "Thay khăn mới", "Wart (mụn cóc)"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Plastic/ Nhựa"]}, {"id": "IMG_4300-61", "source_image": "IMG_4300.HEIC", "question": "Việc xoa bóp giúp tăng cường lưu thông máu, nên tình trạng bệnh lý nào sau đây sẽ cần có sự chấp thuận của bác sĩ trước khi thực hiện dịch vụ xoa bóp?", "answer": "**High blood pressure/ Cao huyết áp**", "distractors": ["Xương trụ (xương cánh tay trước)", "Xương quay (Xương cánh tay trước)", "do màu sơn hoặc tuần hoàn máu kém"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["High blood pressure/ Cao huyết áp"]}, {"id": "IMG_4300-62", "source_image": "IMG_4300.HEIC", "question": "Trong số những thứ sau đây, dụng cụ nào giúp làm mịn các vết chai ở chân?", "answer": "**Foot file/ Dũa chân**", "distractors": ["Nấm ở tay (o được làm)", "(theo chìu) vòng tròn", "Bệnh cắn móng tay"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Foot file/ Dũa chân"]}, {"id": "IMG_4300-63", "source_image": "IMG_4300.HEIC", "question": "Khi thực hiện liệu trình chăm sóc móng chân (pedicure), loại dung dịch nào tuyệt đối không được thêm vào khi chân của khách hàng đang ngâm trong bồn spa?", "answer": "**Disinfectant/ Chất khử trùng**", "distractors": ["Những thành phần độc hại", "xà phòng/ nước để tẩy rửa", "Hệ thống thông gió ra ngoài"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Disinfectant/ Chất khử trùng"]}, {"id": "IMG_4300-64", "source_image": "IMG_4300.HEIC", "question": "Loại đèn nào sau đây được sử dụng để làm khô các sản phẩm móng giả?", "answer": "**Ultraviolet/ Đèn cực tím (UV)**", "distractors": ["Nhanh mịn (khéo léo, mềm mại)", "lớp ức chế (inhibition layer)", "Wooden pusher/ Que đẩy bằng gỗ"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Sta  Tẩy tế bào chết"]}, {"id": "IMG_4300-68", "source_image": "IMG_4300.HEIC", "question": "Yếu tố nào sau đây là một trong ba thành phần cơ bản trong quá trình làm cứng acrylic?", "answer": "**Monomer**", "distractors": ["Cơ xòe", "Carpus", "Cơ gấp"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Monomer"]}, {"id": "IMG_4300-69", "source_image": "IMG_4300.HEIC", "question": "Massage khi làm móng chân được định nghĩa là các thao tác xoa, véo, nhào nặn và gõ nhẹ. Từ điển y học gọi các thao tác này là?", "answer": "**A method of manipulation/ Một phương pháp trị liệu bằng tay**", "distractors": ["Do bị chấn thương nền móng (làm dịch vụ như bình thường)", "đắp chồng với tip hoặc form (khuôn móng sculpture nail)", "Móng chẻ và dòn (dùng loại giũa giấy mịn, dùng dầu)"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["A method of manipulation/ Một phương pháp trị liệu bằng tay"]}, {"id": "IMG_4300-70", "source_image": "IMG_4300.HEIC", "question": "Yếu tố nào sau đây được sử dụng trước lớp primer để loại bỏ độ ẩm và dầu trên bề mặt móng trước khi đắp móng acrylic?", "answer": "**Dehydrator/ Chất khử dầu**", "distractors": ["ngâm chân để tiệt trùng", "chất kết dính (adhesion)", "Trợ giúp bột dính vào móng"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Dehydrator/ Chất khử dầu"]}, {"id": "IMG_4300-71", "source_image": "IMG_4300.HEIC", "question": "Việc tháo móng acrylic được thực hiện bằn  / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Brush"]}, {"id": "IMG_4301-75", "source_image": "IMG_4301.HEIC", "question": "Dụng cụ nào sau đây nên được sử dụng để thoa dung dịch làm mềm da chết?", "answer": "**Cotton tipped wooden stick/ Que gỗ quấn bông**", "distractors": ["Humerus xương lớn nhất (từ cùi chỏ tới vai)", "Xước mang rô (da xước chunh quanh móng)", "Lấy phân lồi ở đầu ngón cái, da khô, chai chân"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Cotton tipped wooden stick/ Que gỗ quấn bông"]}, {"id": "IMG_4301-76", "source_image": "IMG_4301.HEIC", "question": "Trong số các lựa chọn sau, chất nào có thể được sử dụng để làm tan mô mềm bám trực tiếp vào bản móng?", "answer": "**Cuticle remover**", "distractors": ["lớp sơn phủ bóng", "chất nhạy quang", "Vùng stress area"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Cuticle remover"]}, {"id": "IMG_4301-77", "source_image": "IMG_4301.HEIC", "question": "Động tác nào sau đây là một động tác thư giãn, bao gồm việc ấn vào mô da ở mu bàn chân trong quá trình làm móng chân?", "answer": "**Petrissage**", "distractors": ["nấm da tay", "Humerus.", "26 xương"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Petrissage"]}, {"id": "IMG_4301-78", "source_image": "IMG_4301.HEIC", "question": "Động tác xoa bóp nào sau đây được thực hiện ở lòng bàn chân nhằm kích thích lưu thông máu?", "answer": "**Friction**", "distractors": ["Extensor", "Cơ duỗi", "Patella"], "explanation": <script>
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='nailVA_v1';const MAXBOX=5,ROUND=15;
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{box:{},due:{},intro:[],streakBest:0,step:0};
function save(){localStorage.setItem(KEY,JSON.stringify(S));prog()}
const byId=Object.fromEntries(D.map(x=>[x.id,x]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s,kws){let h=esc(s).replace(/\*\*(.+?)\*\*/g,'<span class="kw">$1</span>');return h}
const plain=s=>String(s).replace(/\*\*/g,'');
const mastered=id=>(S.box[id]||0)>=MAXBOX;
function prog(){const m=D.filter(x=>mastered(x.id)).length;const p=Math.round(m/D.length*1000)/10;
 document.getElementById('pbar').style.width=p+'%';
 document.getElementById('ptxt').textContent=`Đã thuộc ${m}/${D.length} câu (${p}%) · Đang học ${S.intro.filter(i=>!mastered(i)).length} · Chuỗi tốt nhất ${S.streakBest}`+(m===D.length?' 🎉 HOÀN THÀNH!':'')}
function ensureRound(){const active=S.intro.filter(i=>!mastered(i));
 if(active.length<10){const fresh=D.filter(x=>!S.intro.includes(x.id)).slice(0,ROUND).map(x=>x.id);S.intro.push(...fresh);fresh.forEach(i=>{S.box[i]=S.box[i]||0;S.due[i]=0});save()}}
function pick(n){ensureRound();S.step++;let act=S.intro.filter(i=>!mastered(i));
 if(!act.length)act=D.map(x=>x.id);
 act.sort((a,b)=>(S.due[a]||0)-(S.due[b]||0)||Math.random()-.5);
 const due=act.filter(i=>(S.due[i]||0)<=S.step);let pool=(due.length>=n?due:act).slice(0,Math.max(n*2,n));
 pool.sort(()=>Math.random()-.5);return pool.slice(0,n).map(i=>byId[i])}
function grade(id,ok){let b=S.box[id]||0;b=ok?Math.min(MAXBOX,b+1):0;S.box[id]=b;S.due[id]=S.step+[1,2,4,8,16,32][b];
 if(!S.intro.includes(id))S.intro.push(id);save()}
// sound
let AC;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
 o.frequency.value=ok?880:180;o.type=ok?'sine':'square';g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.25)}catch(e){}}
function opts(x){const a=[{t:x.answer,ok:true},...x.distractors.map(t=>({t,ok:false}))];return a.sort(()=>Math.random()-.5)}
const app=document.getElementById('app');
function card(x,showSrc){return `<div class="q">${hl(x.question)}</div>`}
function explain(x){return `<div class="expl">✅ <b>Đáp án:</b> ${hl(x.answer)}<br>${esc(x.explanation)}<br><span class="small">📚 ${esc(x.source)} · ảnh ${esc(x.source_image)}${x.notes?' · '+esc(x.notes):''}</span></div>`}

<button class="mode" data-m="boss"><b>👹</b>Đánh Boss</button>
<button class="mode" data-m="flash"><b>🃏</b>Thẻ ghi nhớ</button>
<button class="mode" data-m="data"><b>💾</b>Lưu / Nhập tiến độ</button></div>
<div class="card small">Hệ thống Leitner: mỗi lượt đưa vào ${ROUND} câu mới; trả lời đúng liên tiếp ${MAXBOX} lần (giãn cách) thì câu đó "đã thuộc". Từ <span class="kw">khóa</span> được tô vàng. Tất cả chế độ dùng chung bộ câu hỏi.</div>`;
app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>({quiz,match,mil,bub,boss,flash,data:dataM})[b.dataset.m]())}
let timers=[];function clearAll(){timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]}
document.getElementById('home').onclick=menu;
// QUIZ
function quiz(){clearAll();let streak=0,score=0;next();
 function next(){clearAll();const x=pick(1)[0];let t=25;
  app.innerHTML=`<div class="card pop"><div class="top"><span class="pill">🔥 Chuỗi ${streak}</span><span class="pill">⭐ ${score}</span><span class="pill" id="t">⏱ ${t}s</span></div><br>${card(x)}<div class="opts">${opts(x).map(o=>`<button data-ok="${o.ok}">${hl(o.t)}</button>`).join('')}</div><div id="ex"></div></div>`;
  const bs=[...app.querySelectorAll('.opts button')];
  timers.push(setInterval(()=>{t--;const e=document.getElementById('t');if(e)e.textContent='⏱ '+t+'s';if(t<=0)ans(null)},1000));
  bs.forEach(b=>b.onclick=()=>ans(b));
  function ans(b){clearAll();const ok=b&&b.dataset.ok==='true';bs.forEach(z=>{z.disabled=true;if(z.dataset.ok==='true')z.classList.add('ok')});
   if(b&&!ok){b.classList.add('bad');app.querySelector('.card').classList.add('shake')}
   beep(ok);grade(x.id,ok);if(ok){streak++;score+=10+streak;S.streakBest=Math.max(S.streakBest,streak);save()}else streak=0;
   document.getElementById('ex').innerHTML=explain(x)+`<br><button id="nx" style="width:100%">Câu tiếp ➜</button>`;document.getElementById('nx').onclick=next}}}
// MATCH
function match(){clearAll();const xs=pick(5);let sel=null,left=xs.length,err=0;
 const L=xs.map(x=>({id:x.id,h:hl(x.question),s:'q'})),Rr=xs.map(x=>({id:x.id,h:hl(x.answer),s:'a'})).sort(()=>Math.random()-.5);
 app.innerHTML=`<div class="card"><div class="top"><b>Ghép câu hỏi với đáp án</b><span class="pill" id="me">Sai: 0</span></div><br><div class="match">${L.map((l,i)=>`<button data-id="${l.id}" data-s="q">${l.h}</button><button data-id="${Rr[i].id}" data-s="a">${Rr[i].h}</button>`).join('')}</div><div id="ex"></div></div>`;
 const wrong=new Set();
 app.querySelectorAll('.match button').forEach(b=>b.onclick=()=>{if(!sel||sel.dataset.s===b.dataset.s){sel&&sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
  if(sel.dataset.id===b.dataset.id){beep(true);sel.classList.add('done');b.classList.add('done');grade(b.dataset.id,!wrong.has(b.dataset.id));left--;
   if(!left){document.getElementById('ex').innerHTML=`<br><button id="nx" style="width:100%">🎉 Ván mới</button>`;document.getElementById('nx').onclick=match}}
  else{beep(false);err++;wrong.add(sel.dataset.s==='q'?sel.dataset.id:b.dataset.id);b.classList.add('shake');document.getElementById('me').textContent='Sai: '+err}
  sel.classList.remove('sel');sel=null})}
// MILLIONAIRE
const PR=['200K','400K','600K','1TR','2TR','3TR','6TR','10TR','14TR','22TR','30TR','40TR','80TR','150TR','250TR'];
function mil(){clearAll();const xs=pick(15);let lv=0,life={f:1,a:1,s:1};q();
 function q(){const x=xs[lv];if(!x){app.innerHTML=`<div class="card">🏆 Bạn là triệu phú!<br><button onclick="mil()">Chơi lại</button></div>`;return}
  const os=opts(x);app.innerHTML=`<div class="card"><div class="ladder">${PR.map((p,i)=>`<span class="${i===lv?'cur':''}">${i+1}. ${p}</span>`).join('')}</div><br>${card(x)}
  <div class="opts">${os.map((o,i)=>`<button data-ok="${o.ok}">${'ABCD'[i]}. ${hl(o.t)}</button>`).join('')}</div><br>
  <div class="row"><button id="f" ${life.f?'':'disabled'}>50:50</button><button id="a" ${life.a?'':'disabled'}>👥 Hỏi khán giả</button><button id="s" ${life.s?'':'disabled'}>🔄 Đổi câu</button></div><div id="ex"></div></div>`;
  const bs=[...app.querySelectorAll('.opts button')];
  document.getElementById('f').onclick=()=>{life.f=0;bs.filter(b=>b.dataset.ok!=='true').sort(()=>Math.random()-.5).slice(0,2).forEach(b=>b.style.visibility='hidden');document.getElementById('f').disabled=true};
  document.getElementById('a').onclick=()=>{life.a=0;bs.forEach(b=>{const p=b.dataset.ok==='true'?55+Math.random()*30|0:Math.random()*20|0;b.innerHTML+=` <span class="small">(${p}%)</span>`});document.getElementById('a').disabled=true};
  document.getElementById('s').onclick=()=>{life.s=0;xs[lv]=pick(1)[0];q()};
  bs.forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='true';bs.forEach(z=>{z.disabled=true;if(z.dataset.ok==='true')z.classList.add('ok')});if(!ok)b.classList.add('bad');beep(ok);grade(x.id,ok);
   document.getElementById('ex').innerHTML=explain(x)+`<br><button id="nx" style="width:100%">${ok?'Câu tiếp ➜':'Thua rồi 😢 – chơi lại'}</button>`;
   document.getElementById('nx').onclick=()=>{if(ok){lv++;q()}else mil()}})}}
// BUBBLES
function bub(){clearAll();let lives=3,score=0;round();
 function round(){clearAll();const x=pick(1)[0];const os=opts(x);
  app.innerHTML=`<div class="card"><div class="top"><span class="pill">❤️ ${lives}</span><span class="pill">⭐ ${score}</span></div><br>${card(x)}</div><div id="field"></div>`;
  const F=document.getElementById('field');const H=F.clientHeight;let done=false;
  os.forEach((o,i)=>{const e=document.createElement('button');e.className='bub';e.innerHTML=hl(o.t);e.style.left=(5+i*24)%80+'%';let y=-60-i*40;e.style.top=y+'px';F.appendChild(e);
   const sp=.6+Math.random()*.5;timers.push(setInterval(()=>{if(done)return;y+=sp;e.style.top=y+'px';if(y>H&&o.ok)finish(false)},16));
   e.onclick=()=>finish(o.ok,e)});
  function finish(ok,e){if(done)return;done=true;beep(ok);grade(x.id,ok);if(ok)score+=10;else lives--;
   if(e)e.style.background=ok?'var(--ok)':'var(--bad)';
   const ex=document.createElement('div');ex.innerHTML=explain(x)+`<br><button id="nx" style="width:100%">${lives>0?'Tiếp ➜':'Hết mạng – chơi lại'}</button>`;app.appendChild(ex);
   document.getElementById('nx').onclick=()=>lives>0?round():bub()}}}
// BOSS
function boss(){clearAll();let hp=100,me=100;const B=['👹','🐉','👾','🦂'][Math.random()*4|0];turn();
 function turn(){clearAll();if(hp<=0||me<=0){app.innerHTML=`<div class="card" style="text-align:center"><div class="boss">${hp<=0?'🏆':'💀'}</div>${hp<=0?'Bạn đã hạ Boss!':'Boss thắng rồi…'}<br><br><button onclick="boss()">Đấu lại</button></div>`;return}
  const x=pick(1)[0];app.innerHTML=`<div class="card"><div class="boss" id="bs">${B}</div>Boss<div class="hp"><i style="width:${hp}%"></i></div>Bạn<div class="hp"><i style="width:${me}%;background:var(--ok)"></i></div><br>${card(x)}<div class="opts">${opts(x).map(o=>`<button data-ok="${o.ok}">${hl(o.t)}</button>`).join('')}</div><div id="ex"></div></div>`;
  const bs=[...app.querySelectorAll('.opts button')];
  bs.forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='true';bs.forEach(z=>{z.disabled=true;if(z.dataset.ok==='true')z.classList.add('ok')});beep(ok);grade(x.id,ok);
   if(ok){hp-=20;document.getElementById('bs').classList.add('hit')}else{me-=25;b.classList.add('bad');app.querySelector('.card').classList.add('shake')}
   document.getElementById('ex').innerHTML=explain(x)+`<br><button id="nx" style="width:100%">Tiếp ➜</button>`;document.getElementById('nx').onclick=turn})}}
// FLASH
function flash(){clearAll();const x=pick(1)[0];
 app.innerHTML=`<div class="flash"><div class="fc" id="fc"><div>${hl(x.question)}</div><div class="fc-b"><div>${hl(x.answer)}<div class="small" style="margin-top:10px">${esc(x.explanation)}</div></div></div></div></div><p class="small" style="text-align:center">Chạm vào thẻ để lật</p>
 <div class="row"><button id="no" style="background:var(--bad)">😕 Chưa nhớ</button><button id="yes" style="background:var(--ok);color:#002">😎 Nhớ rồi</button></div>`;
 document.getElementById('fc').onclick=e=>e.currentTarget.classList.toggle('flip');
 document.getElementById('yes').onclick=()=>{grade(x.id,true);beep(true);flash()};document.getElementById('no').onclick=()=>{grade(x.id,false);beep(false);flash()}}
// DATA
function dataM(){clearAll();app.innerHTML=`<div class="card"><b>Xuất / Nhập tiến độ</b><p class="small">Dùng để chuyển tiến độ giữa iPhone, iPad và Mac.</p>
<div class="row"><button id="ex">⬇️ Xuất file JSON</button><button id="cp">📋 Sao chép</button></div><br>
<textarea id="ta" placeholder="Dán JSON tiến độ vào đây"></textarea><div class="row"><button id="im">⬆️ Nhập từ ô</button><label class="pill" style="display:flex;align-items:center;justify-content:center;flex:1;min-height:52px">📂 Chọn file<input type="file" id="fi" accept=".json,application/json" hidden></label></div><br>
<button id="rs" style="background:#5a1f2f;width:100%">Xóa toàn bộ tiến độ</button><p id="msg"></p></div>`;
 const msg=t=>document.getElementById('msg').textContent=t;
 document.getElementById('ex').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nail-progress.json';a.click()};
 document.getElementById('cp').onclick=()=>{document.getElementById('ta').value=JSON.stringify(S);try{navigator.clipboard.writeText(JSON.stringify(S)).catch(()=>{})}catch(e){};msg('Đã sao chép')};
 const imp=t=>{try{const o=JSON.parse(t);if(!o.box)throw 0;S=o;save();msg('Đã nhập ✔')}catch(e){msg('JSON không hợp lệ')}};
 document.getElementById('im').onclick=()=>imp(document.getElementById('ta').value);
 document.getElementById('fi').onchange=e=>{const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(e.target.files[0])};
 document.getElementById('rs').onclick=()=>{if(confirm('Xóa hết?')){S={box:{},due:{},intro:[],streakBest:0,step:0};save();msg('Đã xóa')}}}
prog();menu();
</script></body></html>
