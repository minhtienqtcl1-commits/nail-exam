, OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Single-use"]}, {"id": "IMG_4297-25", "source_image": "IMG_4297.HEIC", "question": "Một đặc điểm của móng tự nhiên là?", "answer": "**They are appendages of the skin/ Chúng là các phần phụ của da**", "distractors": ["They are made of living cells/ Chúng được cấu tạo từ tế bào sống", "They contain nerves and blood vessels/ Chúng chứa dây thần kinh và mạch máu", "They grow faster in older people/ Chúng mọc nhanh hơn ở người lớn tuổi"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["They are appendages of the skin/ Chúng là các phần phụ của da"]}, {"id": "IMG_4297-26", "source_image": "IMG_4297.HEIC", "question": "Vi khuẩn còn được gọi là?", "answer": "**Microbes/ germs/ Vi sinh vật/ mầm bệnh**", "distractors": ["Viruses/ toxins/ Siêu vi/ độc tố", "Fungi/ molds/ Nấm/ mốc", "Parasites/ mites/ Ký sinh/ ve"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Microbes/ germs/ Vi sinh vật/ mầm bệnh"]}, {"id": "IMG_4297-27", "source_image": "IMG_4297.HEIC", "question": "Khi tư vấn cho khách hàng bị xước măng rô, lời khuyên chăm sóc phù hợp nhất là?", "answer": "**Receive a hot oil manicure/ Thực hiện liệu trình dưỡng móng bằng dầu nóng**", "distractors": ["Cut the hangnail deeply/ Cắt sâu phần da xước măng rô", "Apply acrylic over it/ Đắp bột acrylic phủ lên vùng da xước", "Soak in acetone daily/ Ngâm tay trong acetone mỗi ngày"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Receive a hot oil manicure/ Thực hiện liệu trình dưỡng móng bằng dầu nóng"]}, {"id": "IMG_4297-28", "source_image": "IMG_4297.HEIC", "question": "Cần làm gì đối với các dụng cụ sau khi lấy ra khỏi dung dịch khử trùng?", "answer": "**Rinse thoroughly with water and dry/ Rửa thật sạch bằng nước và lau khô**", "distractors": ["Store them immediately while wet/ Cất ngay khi còn ướt", "Spray with alcohol and reuse/ Xịt cồn rồi dùng lại", "Leave them on the table to air dry/ Để trên bàn cho tự khô"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Rinse thoroughly with water and dry/ Rửa thật sạch bằng nước và lau khô"]}, {"id": "IMG_4297-29", "source_image": "IMG_4297.HEIC", "question": "Các chất lỏng monomer, gel UV và chất kết dính sẽ tạo ra?", "answer": "**Vapors/ Hơi** (danh từ chỉ hơi nước, chất khí hoặc các giọt lỏng cực nhỏ bay hơi từ chất lỏng/rắn khi bị đốt nóng)", "distractors": ["Sediment/ Cặn lắng (chất rắn lắng xuống đáy khi để lâu)", "Static/ Tĩnh điện (điện tích tích tụ trên bề mặt khi ma sát)", "Crystals/ Tinh thể (chất rắn kết tinh khi gặp lạnh)"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Vapors/ Hơi"]}, {"id": "IMG_4297-30", "source_image": "IMG_4297.HEIC", "question": "Các bản móng có độ cong tăng cường thường có những đường cong sâu hoặc sắc nét tại bờ tự do. Hình dạng này được xác định bởi?", "answer": "**The matrix/ Mầm móng**", "distractors": ["The nail bed/ Giường móng", "The lunula/ Liềm EIC", "question": "Yếu tố nào sau đây là các đốm trắng trên móng?", "answer": "**Leukonychia**", "distractors": ["Melanonychia", "Onychorrhexis", "Onychauxis"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Leukonychia"]}, {"id": "IMG_4298-34", "source_image": "IMG_4298.HEIC", "question": "Sự phát triển của bản móng người khỏe mạnh chủ yếu được quyết định bởi chế độ ăn uống hợp lý, việc tập luyện thể dục và sức khỏe thể chất. Hình dáng, chiều rộng và độ dày của móng được quyết định bởi?", "answer": "**The matrix**", "distractors": ["The nail bed", "The lunula", "The cuticle"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["The matrix"]}, {"id": "IMG_4298-35", "source_image": "IMG_4298.HEIC", "question": "Cơ quan nào sau đây là cơ quan lớn nhất trong cơ thể người?", "answer": "**Skin**", "distractors": ["Liver", "Heart", "Brain"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Skin"]}, {"id": "IMG_4298-36", "source_image": "IMG_4298.HEIC", "question": "Cơ nào sau đây giúp nâng bàn chân lên và duỗi các ngón chân?", "answer": "**Extensor digitorum/ Cơ duỗi ngón**", "distractors": ["Gastrocnemius/ Cơ bắp chân", "Soleus/ Cơ dép", "Peroneus longus/ Cơ mác dài"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Extensor digitorum/ Cơ duỗi ngón"]}, {"i ource": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Disinfected/ khử trùng"]}, {"id": "IMG_4298-41", "source_image": "IMG_4298.HEIC", "question": "Dụng cụ nào giúp tạo độ bóng và làm nhẵn các đường gợn sóng trên móng tự nhiên trong quá trình làm móng?", "answer": "**Buffer** (cục đánh bóng 3 mặt)", "distractors": ["Emery board (giũa giấy 2 mặt)", "Orangewood stick (que gỗ cam)", "Pumice stone (đá bọt mài chân)"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "✅ Đã sửa theo nguồn: https://www.nailsmag.com/articles/time-to-shine (ảnh ghi: \"Nail brush\")", "keywords": ["Buffer"]}, {"id": "IMG_4298-42", "source_image": "IMG_4298.HEIC", "question": "Người hành nghề nên từ chối phục vụ khách hàng khi xuất hiện trường hợp nào sau đây?", "answer": "**Infection, inflammation, or swelling/ Nhiễm trùng, viêm hoặc sưng tấy**", "distractors": ["Dry skin, ridges, or white spots/ Da khô, móng gợn sóng hoặc đốm trắng", "Bitten nails, hangnails, or bruises/ Móng bị cắn, xước măng rô hoặc bầm", "Eggshell nails, splits, or stains/ Móng vỏ trứng, móng chẻ hoặc ố màu"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Infection, inflammation, or swelling/ Nhiễm trùng, viêm hoặc sưng tấy"]}, {"id": "IMG_4298-43", "source_image": "IMG_4298.HEIC", "question": "Khi thực hiện quy trình làm móng cơ bản, cần đặc biệt lưu ý đến bước giũa móng tay. Móng tay thường mỏng manh và dễ gãy hơn, do đó nên được giũa theo cách?", "answer": "**Right to center, then left to center/ Từ phải vào giữa, sau đó từ trái vào giữa**", "distractors": ["Back and forth in a sawing motion/ Qua lại liên tục như cưa", "Center to corners, pressing hard/ Từ giữa ra góc, ấn mạnh tay", "Deep into the corners, then across/ Sâu vào góc, sau đó ngang móng"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Right to center, then left to center/ Từ phải vào giữa, sau đó từ trái vào giữa"]}, {"id": "IMG_4298-44", "source_image": "IMG_4298.HEIC", "question": "Sau khi hoàn tất dịch vụ làm móng, các dụng cụ sử dụng một lần được đặt vào loại vật chứa nào sau đây?", "answer": "**Trash container/ Thùng rác**", "distractors": ["Disinfectant jar/ Bình khử trùng", "Covered storage/ Hộp đựng kín", "Autoclave/ Nồi hấp tiệt trùng"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Trash container/ Thùng rác"]}, {"id": "IMG_4298-45", "source_image": "IMG_4298.HEIC", "question": "Kỹ thuật viên làm móng đã sẵn sàng chuẩn bị cho khách hàng tiếp theo – người sẽ thực hiện dịch vụ nối dài móng bằng móng giả (nail tips). Loại keo dán được sử dụng để gắn móng giả lên móng thật của khách hàng được gọi là?", "answer": "**Adhesive bonding agent/ Chất kết dính**", "distractors": ["Monomer liquid agent/ Chất lỏng đơn phân", "Acid primer agent/ Chất lót acid", "Dehydrating agent/ Chất khử ẩm"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Adhesive bonding agent/ Chất kết dính"]}, {"id": "IMG_4299-46", "source_image": "IMG_4299.HEIC", "question": "Động tác xoa bóp thư giãn nào sau đây, được sử dụng trong quy trình làm móng tay và móng chân, có đặc điểm là chậm rãi, nhịp nhàng và vuốt nhẹ?", "answer": "**Effleurage / Vuốt**", "distractors": ["Petrissage / Nhào bóp", "Friction / Ma sát", "Tapotement / Vỗ"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Effleurage / Vuốt"]}, {"id": "IMG_4299-47", "source_image": "IMG_4299.HEIC", "question": "Sản phẩm nào sau đây được sử dụng ngay trước khi sơn móng màu?", "answer": "**Base coat**", "distractors": ["Top coat", "Cuticle oil", "Dehydrator"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Base coat"]}, {"id": "IMG_4299-48", "source_image": "IMG_4299.HEIC", "question": "Động tác xoa bóp cần được hoàn thiện và sử dụng một cách điêu luyện nhằm mục đích giúp khách hàng thư giãn trong quá trình làm móng chân được gọi là?", "answer": "**Effleurage / Vuốt**", "distractors": ["Petrissage / Nhào bóp", "Friction / Ma sát", "Tapotement / Vỗ"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Effleurage / Vuốt"]}, {"id": "IMG_4299-49", "source_image": "IMG_4299.HEIC", "question": "Dịch vụ nào sau đây được khuyên dùng cho da và móng khô?", "answer": "**Warm oil/lotion**", "distractors": ["Acetone soak", "Pumice scrub", "Nail bleach"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Warm oil/lotion"]}, {"id": "IMG_4299-50", "source_image": "IMG_4299.HEIC", "question": "Yếu tố nào sau đây chứa thông tin cần thiết để thực hiện một dịch vụ làm móng thành công?", "answer": "**Client card/ Thẻ khách hàng**", "distractors": ["Price list/ Bảng giá", "Appointment book/ Sổ hẹn", "SDS binder/ Hồ sơ SDS"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Client card/ Thẻ khách hàng"]}, {"id": "IMG_4299-51", "source_image": "IMG_4299.HEIC", "question": "Chất nào sau đây là một trong những dung môi an toàn và phổ biến nhất được sử dụng tại các tiệm làm đẹp?", "answer": "**Acetone**", "distractors": ["Toluene", "Formaldehyde", "Benzene"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Acetone"]}, {"id": "IMG_4299-52", "source_image": "IMG_4299.HEIC", "question": "Kỹ thuật giũa móng tự nhiên nào sau đây có thể gây ra tình trạng móng mọc ngược?", "answer": "**Into the corners/ Giũa sâu vào các góc móng**", "distractors": ["Straight across/ Giũa thẳng ngang", "Lightly with fine grit/ Giũa nhẹ bằng giũa mịn", "Side to center/ Giũa từ cạnh vào giữa"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Into the corners/ Giũa sâu vào các góc móng"]}, {"id": "IMG_4299-53", "source_image": "IMG_4299.HEIC", "question": "Đối với các chuyên gia cung cấp dịch vụ làm đẹp và tạo hình móng, việc đầu tư một máy dũa điện là một tài sản giá trị. Khi lựa chọn thiết bị này, bạn nên cân nhắc đến yếu tố mô-men xoắn của máy. Mô-men xoắn được xem là yếu tố quyết định đến?", "answer": "**Power/ Công suất máy**", "distractors": ["Speed/ Tốc độ quay", "Weight/ Trọng lượng", "Noise/ Độ ồn"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Power/ Công suất máy"]}, {"id": "IMG_4299-54", "source_image": "IMG_4299.HEIC", "question": "Trong quá trình tạo hình móng giả, yếu tố nào sau đây giúp đẩy nhanh quá trình hóa học?", "answer": "**Catalyst/ Chất xúc tác**", "distractors": ["Inhibitor/ Chất ức chế", "Solvent/ Chất dung môi", "Plasticizer/ Chất hóa dẻo"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Catalyst/ Chất xúc tác"]}, {"id": "IMG_4299-55", "source_image": "IMG_4299.HEIC", "question": "Khi thực hiện dịch vụ chăm sóc móng chân, điều vô cùng quan trọng cần ghi nhớ là không được đẩy hoặc cắt phần biểu bì gốc móng (eponychium). Điều này đặc biệt quan trọng đối với những khách hàng mắc các bệnh lý như?", "answer": "**Diabetes/ Tiểu đường**", "distractors": ["Arthritis/ Viêm khớp", "Eczema/ Chàm", "Migraine/ Đau nửa đầu"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Diabetes/ Tiểu đường"]}, {"id": "IMG_4299-56", "source_image": "IMG_4299.HEIC", "question": "Bộ phận nào của móng giả có điểm dừng định vị để căn chỉnh với móng thật?", "answer": "**Well/ Phần lõm**", "distractors": ["Apex/ Đỉnh cong", "Contact/ Vùng tiếp xúc", "Free edge/ Đầu móng"], "explanation": "Quy trình dịch vụ manicure/pedicure & tư vấn khách theo Milady.", "source": "Milady Standard Nail Technology – Manicuring / Pedicuring / Client consultation chapters", "notes": "", "keywords": ["Well/ Phần lõm"]}, {"id": "IMG_4299-57", "source_image": "IMG_4299.HEIC", "question": "Các dụng cụ làm móng dùng một lần bị loại bỏ vì chúng?", "answer": "**Are unable to be disinfected and reused/ Không thể khử trùng và tái sử dụng**", "distractors": ["Are too expensive to disinfect/ Quá đắt để khử trùng", "Lose their color after use/ Bị phai màu sau khi dùng", "Are made of metal and rust/ Làm bằng kim loại và bị gỉ"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Are unable to be disinfected and reused/ Không thể khử trùng và tái sử dụng"]}, {"id": "IMG_4299-58", "source_image": "IMG_4299.HEIC", "question": "Việc sử dụng loại ánh sáng nào giúp làm khô móng gel?", "answer": "**Ultraviolet/ Đèn cực tím (UV)**", "distractors": ["Infrared/ Đèn hồng ngoại (IR)", "Halogen/ Đèn halogen", "Fluorescent/ Đèn huỳnh quang"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Ultraviolet/ Đèn cực tím (UV)"]}, {"id": "IMG_4299-59", "source_image": "IMG_4299.HEIC", "question": "Trong quá trình đánh giá tình trạng khách hàng để thực hiện dịch vụ làm móng, vùng da quanh một móng tay bị đỏ và sưng tấy. Người thực hiện dịch vụ nên thực hiện hành động nào sau đây?", "answer": "**Tell the client about the disease and refer the client to a physician/ Thông báo cho khách hàng về tình per/ Kềm bấm", "Cuticle pusher/ Que đẩy", "Emery board/ Giũa giấy"], "explanation": "Nhận biết rối loạn & bệnh móng/da: bệnh lây nhiễm (nấm, nhiễm trùng) thì không làm dịch vụ và giới thiệu bác sĩ.", "source": "Milady Standard Nail Technology – Nail Disorders and Diseases / Skin Disorders chapters", "notes": "", "keywords": ["Foot file/ Dũa chân"]}, {"id": "IMG_4300-63", "source_image": "IMG_4300.HEIC", "question": "Khi thực hiện liệu trình chăm sóc móng chân (pedicure), loại dung dịch nào tuyệt đối không được thêm vào khi chân của khách hàng đang ngâm trong bồn spa?", "answer": "**Disinfectant/ Chất khử trùng**", "distractors": ["Foot soak/ Dung dịch ngâm chân", "Liquid soap/ Xà phòng lỏng", "Aromatherapy oil/ Tinh dầu thơm"], "explanation": "Kiểm soát nhiễm khuẩn: làm sạch → khử trùng bằng thuốc đăng ký EPA, theo hướng dẫn nhà sản xuất; OSHA yêu cầu SDS và đồ bảo hộ.", "source": "Milady Standard Nail Technology – Infection Control chapter; EPA (disinfectant registration), OSHA (SDS/PPE), CDC (hand hygiene)", "notes": "", "keywords": ["Disinfectant/ Chất khử trùng"]}, {"id": "IMG_4300-64", "source_image": "IMG_4300.HEIC", "question": "Loại đèn nào sau đây được sử dụng để làm khô các sản phẩm móng giả?", "answer": "**Ultraviolet/ Đèn cực tím (UV)**", "distractors": ["Infrared/ Đèn hồng ngoại (IR)", "Halogen/ Đèn halogen", "Fluorescent/ Đèn huỳnh quang"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Ultraviolet/ Đèn cực tím (UV)"]}, {"id": "IMG_4300-65", "source_image": "IMG_4300.HEIC", "question": "Việc loại bỏ lớp dầu thừa trên bề mặt móng trước khi gắn móng giả sử dụng sản phẩm nào sau đây?", "answer": "**Dehydrator/ Chất khử dầu**", "distractors": ["Cuticle oil/ Dầu biểu bì", "Top coat/ Sơn bóng", "Hand lotion/ Kem dưỡng tay"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Dehydrator/ Chất khử dầu"]}, {"id": "IMG_4300-66", "source_image": "IMG_4300.HEIC", "question": "Trong quy trình làm móng acrylic, sản phẩm nào sau đây được sử dụng để loại bỏ độ ẩm và dầu trên bề mặt móng?", "answer": "**Dehydrator/ Chất khử dầu**", "distractors": ["Cuticle oil/ Dầu biểu bì", "Top coat/ Sơn bóng", "Hand lotion/ Kem dưỡng tay"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Dehydrator/ Chất khử dầu"]}, {"id": "IMG_4300-67", "source_image": "IMG_4300.HEIC", "question": "Việc áp dụng phương pháp nào sau đây giúp loại bỏ da chết trong quá trình làm móng chân?", "answer": "**Exfoliation scrub/ Tẩy tế bào chết**", "distractors": ["Paraffin dip/ Nhúng sáp paraffin", "Hot oil soak/ Ngâm dầu nóng", "Gel polish/ Sơn gel"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Exfoliation scrub/ Tẩy tế bào chết"]}, {"id": "IMG_4300-68", "source_image": "IMG_4300.HEIC", "question": "Yếu tố nào sau đây là một trong ba thành phần cơ bản trong quá trình làm cứng acrylic?", "answer": "**Monomer**", "distractors": ["Acetone", "Dehydrator", "Solvent"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Monomer"]}, {"id": "IMG_4300-69", "source_image": "IMG_4300.H in Structure chapters", "notes": "", "keywords": ["Cotton tipped wooden stick/ Que gỗ quấn bông"]}, {"id": "IMG_4301-76", "source_image": "IMG_4301.HEIC", "question": "Trong số các lựa chọn sau, chất nào có thể được sử dụng để làm tan mô mềm bám trực tiếp vào bản móng?", "answer": "**Cuticle remover**", "distractors": ["Cuticle oil", "Nail bleach", "Base coat"], "explanation": "Hóa học sản phẩm móng: monomer + polymer → polymerization; gel cứng nhờ chất nhạy quang dưới UV/LED.", "source": "Milady Standard Nail Technology – Chemistry of nail products; Nail Tips & Wraps; Monomer Liquid & Polymer Powder; UV/LED Gels chapters", "notes": "", "keywords": ["Cuticle remover"]}, {"id": "IMG_4301-77", "source_image": "IMG_4301.HEIC", "question": "Động tác nào sau đây là một động tác thư giãn, bao gồm việc ấn vào mô da ở mu bàn chân trong quá trình làm móng chân?", "answer": "**Petrissage**", "distractors": ["Effleurage", "Friction", "Tapotement"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Petrissage"]}, {"id": "IMG_4301-78", "source_image": "IMG_4301.HEIC", "question": "Động tác xoa bóp nào sau đây được thực hiện ở lòng bàn chân nhằm kích thích lưu thông máu?", "answer": "**Friction**", "distractors": ["Effleurage", "Petrissage", "Vibration"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technology – Anatomy & Physiology / Skin Structure chapters", "notes": "", "keywords": ["Friction"]}, {"id": "IMG_4301-79", "source_image": "IMG_4301.HEIC", "question": "Da khô, bong tróc và các vết chai sần có thể được làm mềm trong quá trình làm móng chân bằng cách sử dụng?", "answer": "**Scrubs/ Tẩy tế bào chết**", "distractors": ["Acetone/ Dung môi", "Primer/ Chất lót", "Bleach/ Thuốc tẩy"], "explanation": "Kiến thức giải phẫu tay/chân/móng theo Milady.", "source": "Milady Standard Nail Technolog <script>

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

 const learning=S.intro.filter(i=>!mastered(i));
 const pri=i=>(S.box[i]||0)*10-(S.err[i]||0)*3;
 if(weakOnly){const w=S.intro.filter(i=>(S.err[i]||0)>0).sort((a,b)=>(isWeak(b)-isWeak(a))||((S.err[b]||0)-(S.err[a]||0))||((S.box[a]||0)-(S.box[b]||0)));add(shuf(w.slice(0,n*2)).sort((a,b)=>pri(a)-pri(b)));return shuf(out).map(i=>byId[i])}
 const due=learning.filter(i=>(S.due[i]||0)<=S.step).sort((a,b)=>pri(a)-pri(b));
 add(due.slice(0,Math.max(n-Math.min(NEWPER,n>>1),Math.ceil(n/2))));
 add(D.filter(x=>!S.intro.includes(x.id)).slice(0,n-out.length>NEWPER?NEWPER:n-out.length).map(x=>x.id));
 add(due);
 add(learning.slice().sort((a,b)=>(S.due[a]||0)-(S.due[b]||0)));
 add(D.filter(x=>!S.intro.includes(x.id)).map(x=>x.id));
 add(S.intro.filter(mastered).sort((a,b)=>(S.due[a]||0)-(S.due[b]||0)));

<div class="grid">${Object.entries(MODES).map(([k,v])=>`<button class="mode" data-m="${k}"><b>${v[0]}</b>${v[1]}${k==='weak'?` (${s.w})`:''}</button>`).join('')}

<button class="mode" data-m="data"><b>💾</b>Lưu / Nhập tiến độ</button></div>

 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m;if(m==='data')return dataM();if(m==='mixgo'){S.mix=true;save();return start(GAMES[Math.random()*GAMES.length|0])}if(GAMES.includes(m)){S.mix=false;save()}start(m)})}

 const others=GAMES.filter(g=>g!==m);const nextMix=others[Math.random()*others.length|0];
 app.innerHTML=`<div class="card res pop"><div class="big">${pct>=80?'🏆':pct>=50?'👍':'💪'} ${c}/${n}</div><div>${esc(MODES[m][1])} – đúng ${pct}%${extra?' · '+esc(extra):''}</div><br>
 <div class="stats"><div><b>${s.m}</b>Đã thuộc</div><div><b>${s.l}</b>Đang học</div><div><b>${s.w}</b>Hay sai</div><div><b>${s.n}</b>Chưa học</div></div>
 ${wrong.length?`<br><div class="wl"><b>Câu trả lời sai (sẽ được hỏi lại sớm):</b>${wrong.map(x=>`<div>❓ ${P(x.question)}<br>✅ ${hl(x.answer)}</div>`).join('')}</div>`:''}<br>
 <div class="col"><button id="again" style="background:var(--ac)">${S.mix?'🔀 Ván tiếp: '+esc(MODES[nextMix][1]):'🔁 Chơi tiếp chế độ này'}</button>
 <button id="other">🎮 Chuyển sang game khác</button><div id="pickm"></div>
 <button id="mix" class="${S.mix?'on':''}">🔀 Trộn chế độ mỗi ván: ${S.mix?'BẬT':'TẮT'}</button>
 <button id="tomenu">🏠 Về menu</button></div></div>`;
 document.getElementById('again').onclick=()=>start(S.mix?nextMix:m);
 document.getElementById('tomenu').onclick=menu;
 document.getElementById('mix').onclick=()=>{S.mix=!S.mix;save();endRoundRedraw()};
 function endRoundRedraw(){S.rounds--;S.hist.pop();endRound(m,c,n,wrong,extra)}
 document.getElementById('other').onclick=()=>{document.getElementById('pickm').innerHTML=`<div class="grid">${others.concat(m==='weak'?[]:['weak']).filter(g=>g!==m).map(g=>`<button class="mode" data-g="${g}"><b>${MODES[g][0]}</b>${MODES[g][1]}</button>`).join('')}<button class="mode" data-g="rand"><b>🎲</b>Ngẫu nhiên</button></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>start(b.dataset.g==='rand'?nextMix:b.dataset.g))}}
// generic multiple-choice runner (quiz & weak)
function mcq(mode,xs,timed){let i=0,c=0,streak=0;const wrong=[];next();
 function next(){clearAll();const x=xs[i];if(!x)return endRound(mode,c,xs.length,wrong);let t=25;
  app.innerHTML=`<div class="card pop"><div class="top"><span class="pill">Câu ${i+1}/${xs.length}</span><span class="pill">🔥 ${streak}</span>${timed?`<span class="pill" id="t">⏱ ${t}s</span>`:''}</div><br>${card(x)}<div class="opts">${opts(x).map(o=>`<button data-ok="${o.ok}">${P(o.t)}</button>`).join('')}</div><div id="ex"></div></div>`;
  const bs=[...app.querySelectorAll('.opts button')];
  if(timed)timers.push(setInterval(()=>{t--;const e=document.getElementById('t');if(e)e.textContent='⏱ '+t+'s';if(t<=0)ans(null)},1000));
  bs.forEach(b=>b.onclick=()=>ans(b));
  function ans(b){clearAll();const ok=!!b&&b.dataset.ok==='true';bs.forEach(z=>{z.disabled=true;if(z.dataset.ok==='true')z.classList.add('ok')});if(b&&!ok)b.classList.add('bad');
   beep(ok);grade(x.id,ok);if(ok){c++;streak++;S.streakBest=Math.max(S.streakBest,streak);save()}else{streak=0;wrong.push(x)}
   document.getElementById('ex').innerHTML=explain(x)+`<br><button id="nx" style="width:100%">${i+1<xs.length?'Câu tiếp ➜':'Xem kết quả ➜'}</button>`;document.getElementById('nx').onclick=()=>{i++;next()}}}}
function quiz(){curMode='quiz';mcq('quiz',pickRound(10),true)}
function weak(){curMode='weak';const xs=pickRound(10,true);if(!xs.length){app.innerHTML=`<div class="card">🎉 Chưa có câu nào hay sai. Hãy chơi các chế độ khác trước!<br><br><button id="tomenu" style="width:100%">🏠 Về menu</button></div>`;document.getElementById('tomenu').onclick=menu;return}mcq('weak',xs,false)}
// MATCH (2 boards x 5)
function match(){clearAll();const all=pickRound(10);let board=0,c=0;const wrongAll=[];play();
 function play(){const xs=all.slice(board*5,board*5+5);if(!xs.length)return endRound('match',c,all.length,wrongAll);let sel=null,left=xs.length,err=0;const wrong=new Set();
  const L=xs.map(x=>({id:x.id,h:P(x.question)})),R=shuf(xs.map(x=>({id:x.id,h:P(x.answer)})));
  app.innerHTML=`<div class="card"><div class="top"><b>Ghép câu hỏi với đáp án (${board+1}/${Math.ceil(all.length/5)})</b><span class="pill" id="me">Sai: 0</span></div><br><div class="match">${L.map((l,i)=>`<button data-id="${l.id}" data-s="q">${l.h}</button><button data-id="${R[i].id}" data-s="a">${R[i].h}</button>`).join('')}</div><div id="ex"></div></div>`;
  app.querySelectorAll('.match button').forEach(b=>b.onclick=()=>{if(!sel||sel.dataset.s===b.dataset.s){sel&&sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
   if(sel.dataset.id===b.dataset.id){beep(true);sel.classList.add('done');b.classList.add('done');const ok=!wrong.has(b.dataset.id);grade(b.dataset.id,ok);if(ok)c++;else wrongAll.push(byId[b.dataset.id]);left--;
    if(!left){board++;document.getElementById('ex').innerHTML=`<br>${xs.map(x=>`<div class="expl">${P(x.question)}<br>✅ ${hl(x.answer)}</div>`).join('')}<br><button id="nx" style="width:100%">${board*5<all.length?'Bảng tiếp ➜':'Xem kết quả ➜'}</button>`;document.getElementById('nx').onclick=play}}
   else{beep(false);err++;wrong.add(sel.dataset.s==='q'?sel.dataset.id:b.dataset.id);b.classList.add('shake');document.getElementById('me').textContent='Sai: '+err}
   sel.classList.remove('sel');sel=null})}}
// MILLIONAIRE
const PR=['200K','400K','600K','1TR','2TR','3TR','6TR','10TR','14TR','22TR','30TR','40TR','80TR','150TR','250TR'];
function mil(){clearAll();const xs=pickRound(15);let pool=pickRound(25).filter(x=>!xs.includes(x));let lv=0,life={f:1,a:1,s:1};const wrong=[];q();
 function q(){const x=xs[lv];if(!x)return endRound('mil',lv,xs.length,wrong,'🏆 Bạn là triệu phú!');
  const os=opts(x);app.innerHTML=`<div class="card"><div class="ladder">${PR.slice(0,xs.length).map((p,i)=>`<span class="${i===lv?'cur':''}">${i+1}. ${p}</span>`).join('')}</div><br>${card(x)}
  <div class="opts">${os.map((o,i)=>`<button data-ok="${o.ok}">${'ABCD'[i]}. ${P(o.t)}</button>`).join('')}</div><br>
  <div class="row"><button id="f" ${life.f?'':'disabled'}>50:50</button><button id="a" ${life.a?'':'disabled'}>👥 Hỏi khán giả</button><button id="s" ${life.s&&pool.length?'':'disabled'}>🔄 Đổi câu</button></div><div id="ex"></div></div>`;
  const bs=[...app.querySelectorAll('.opts button')];
  document.getElementById('f').onclick=()=>{life.f=0;shuf(bs.filter(b=>b.dataset.ok!=='true')).slice(0,2).forEach(b=>b.style.visibility='hidden');document.getElementById('f').disabled=true};
  document.getElementById('a').onclick=()=>{life.a=0;bs.forEach(b=>{const p=b.dataset.ok==='true'?40+Math.random()*30|0:Math.random()*30|0;b.innerHTML+=` <span class="small">(${p}%)</span>`});document.getElementById('a').disabled=true};
  document.getElementById('s').onclick=()=>{life.s=0;xs[lv]=pool.shift();q()};
  bs.forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='true';bs.forEach(z=>{z.disabled=true;if(z.dataset.ok==='true')z.classList.add('ok')});if(!ok){b.classList.add('bad');wrong.push(x)}beep(ok);grade(x.id,ok);
   document.getElementById('ex').innerHTML=explain(x)+`<br><button id="nx" style="width:100%">${ok?(lv+1<xs.length?'Câu tiếp ➜':'Xem kết quả ➜'):'Thua rồi 😢 – xem kết quả'}</button>`;
   document.getElementById('nx').onclick=()=>{if(ok){lv++;q()}else endRound('mil',lv,lv+1,wrong,'Dừng ở mốc '+(lv?PR[lv-1]:'0'))}})}}
// BUBBLES (10 câu hoặc hết 3 mạng)
function bub(){clearAll();const xs=pickRound(10);let lives=3,i=0,c=0;const wrong=[];round();
 function round(){clearAll();const x=xs[i];if(!x||lives<=0)return endRound('bub',c,i,wrong,'❤️ còn '+lives);const os=opts(x);
  app.innerHTML=`<div class="card"><div class="top"><span class="pill">Câu ${i+1}/${xs.length}</span><span class="pill">❤️ ${lives}</span><span class="pill">⭐ ${c*10}</span></div><br>${card(x)}</div><div id="field"></div>`;
  const F=document.getElementById('field');const H=F.clientHeight;let done=false;
  os.forEach((o,k)=>{const e=document.createElement('button');e.className='bub';e.innerHTML=P(o.t);e.style.left=(5+k*24)%80+'%';let y=-60-k*40;e.style.top=y+'px';F.appendChild(e);
   const sp=.6+Math.random()*.5;timers.push(setInterval(()=>{if(done)return;y+=sp;e.style.top=y+'px';if(y>H&&o.ok)finish(false)},16));
   e.onclick=()=>finish(o.ok,e)});
  function finish(ok,e){if(done)return;done=true;clearAll();beep(ok);grade(x.id,ok);if(ok)c++;else{lives--;wrong.push(x)}
   if(e)e.style.background=ok?'var(--ok)':'var(--bad)';i++;
   const ex=document.createElement('div');ex.innerHTML=explain(x)+`<br><button id="nx" style="width:100%">${lives>0&&i<xs.length?'Tiếp ➜':'Xem kết quả ➜'}</button>`;app.appendChild(ex);
   document.getElementById('nx').onclick=round}}}
// BOSS
function boss(){clearAll();const xs=pickRound(12);let hp=100,me=100,i=0,c=0;const wrong=[];const B=['👹','🐉','👾','🦂'][Math.random()*4|0];turn();
 function turn(){clearAll();if(hp<=0||me<=0||!xs[i])return endRound('boss',c,i,wrong,hp<=0?'Bạn đã hạ Boss!':me<=0?'Boss thắng rồi…':'Hòa');
  const x=xs[i];app.innerHTML=`<div class="card"><div class="boss" id="bs">${B}</div>Boss<div class="hp"><i style="width:${hp}%"></i></div>Bạn<div class="hp"><i style="width:${me}%;background:var(--ok)"></i></div><br>${card(x)}<div class="opts">${opts(x).map(o=>`<button data-ok="${o.ok}">${P(o.t)}</button>`).join('')}</div><div id="ex"></div></div>`;
  const bs=[...app.querySelectorAll('.opts button')];
  bs.forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='true';bs.forEach(z=>{z.disabled=true;if(z.dataset.ok==='true')z.classList.add('ok')});beep(ok);grade(x.id,ok);i++;
   if(ok){c++;hp-=20;document.getElementById('bs').classList.add('hit')}else{me-=25;wrong.push(x);b.classList.add('bad');app.querySelector('.card').classList.add('shake')}
   document.getElementById('ex').innerHTML=explain(x)+`<br><button id="nx" style="width:100%">${hp<=0||me<=0?'Xem kết quả ➜':'Tiếp ➜'}</button>`;document.getElementById('nx').onclick=turn})}}
// FLASH (10 thẻ) – mặt trước không tô, mặt sau (đã lật) mới tô từ khóa
function flash(){clearAll();const xs=pickRound(10);let i=0,c=0;const wrong=[];show();
 function show(){const x=xs[i];if(!x)return endRound('flash',c,xs.length,wrong);
  app.innerHTML=`<div class="small" style="text-align:center">Thẻ ${i+1}/${xs.length}</div><div class="flash"><div class="fc" id="fc"><div>${P(x.question)}</div><div class="fc-b"><div><span id="bk">${P(x.answer)}</span><div class="small" style="margin-top:10px">${esc(x.explanation||'')}</div></div></div></div></div><p class="small" style="text-align:center">Chạm vào thẻ để lật</p>
  <div class="row"><button id="no" style="background:var(--bad)">😕 Chưa nhớ</button><button id="yes" style="background:var(--ok);color:#002">😎 Nhớ rồi</button></div>`;
  document.getElementById('fc').onclick=e=>{e.currentTarget.classList.toggle('flip');document.getElementById('bk').innerHTML=hl(x.answer)};
  document.getElementById('yes').onclick=()=>{grade(x.id,true);beep(true);c++;i++;show()};document.getElementById('no').onclick=()=>{grade(x.id,false);beep(false);wrong.push(x);i++;show()}}}
// DATA
function dataM(){clearAll();app.innerHTML=`<div class="card"><b>Xuất / Nhập tiến độ</b><p class="small">Tiến độ tự lưu trên máy này. Dùng mục này để chuyển giữa iPhone, iPad và Mac.</p>
<div class="row"><button id="ex">⬇️ Xuất file JSON</button><button id="cp">📋 Sao chép</button></div><br>
<textarea id="ta" placeholder="Dán JSON tiến độ vào đây"></textarea><div class="row"><button id="im">⬆️ Nhập từ ô</button><label class="pill" style="display:flex;align-items:center;justify-content:center;flex:1;min-height:52px">📂 Chọn file<input type="file" id="fi" accept=".json,application/json" hidden></label></div><br>
<button id="rs" style="background:#5a1f2f;width:100%">Xóa toàn bộ tiến độ</button><p id="msg"></p></div>`;
 const msg=t=>document.getElementById('msg').textContent=t;
 document.getElementById('ex').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nail-progress.json';a.click()};
 document.getElementById('cp').onclick=()=>{document.getElementById('ta').value=JSON.stringify(S);try{navigator.clipboard.writeText(JSON.stringify(S)).catch(()=>{})}catch(e){};msg('Đã sao chép')};
 const imp=t=>{try{const o=JSON.parse(t);if(!o.box)throw 0;S=migrate(o);save();msg('Đã nhập ✔')}catch(e){msg('JSON không hợp lệ')}};
 document.getElementById('im').onclick=()=>imp(document.getElementById('ta').value);
 document.getElementById('fi').onchange=e=>{const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(e.target.files[0])};
 document.getElementById('rs').onclick=()=>{if(confirm('Xóa hết?')){S=migrate(null);save();msg('Đã xóa')}}}
save();menu();
</script></body></html>
